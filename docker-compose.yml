name: appcbm-db

version: '3.7'
services:
  pg:
    container_name: appcbm-db
    image: bitnami/postgresql:latest
    restart: always
    ports:
      - '5444:5432'
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=96135151Ab!
      - POSTGRES_DB=appcbm
    volumes:
      - ./backup:/var/lib/postgresql/data